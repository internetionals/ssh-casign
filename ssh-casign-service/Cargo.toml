[package]
name = "ssh-casign-service"
version = "0.1.0"
edition = "2021"
description = "ssh-casign signing service"

[features]
default = ["ca-file", "tls-native"]
# CA key backends; build only those that make sense for the target platform.
ca-file = ["dep:ssh-casign-ca-file"]
ca-pkcs11 = ["dep:ssh-casign-ca-pkcs11"]
ca-vault = ["dep:ssh-casign-ca-vault"]
ca-azure-keyvault = ["dep:ssh-casign-ca-azure"]
ca-aws-kms = ["dep:ssh-casign-ca-aws"]
# TLS for outgoing HTTPS (IdP, Vault, cloud KMS), for all crates: the
# platform's TLS stack, or rustls (with the OS certificate store and built-in
# Mozilla roots) for static builds, e.g. for serverless platforms.
tls-native = [
  "reqwest/native-tls",
  "ssh-casign-ca-aws?/native-tls",
  "ssh-casign-ca-azure?/native-tls",
  "ssh-casign-ca-vault?/native-tls",
]
tls-rustls = [
  "reqwest/rustls-tls-native-roots",
  "reqwest/rustls-tls-webpki-roots",
  "ssh-casign-ca-aws?/rustls",
  "ssh-casign-ca-azure?/rustls",
  "ssh-casign-ca-vault?/rustls",
]

[dependencies]
reqwest = { version = "0.11.13", default-features = false }
ssh-casign-ca = { path = "../ssh-casign-ca" }
ssh-casign-core = { path = "../ssh-casign-core" }
tokio = { version = "1.41.1", features = ["full"] }
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

ssh-casign-ca-aws = { path = "../ssh-casign-ca-aws", optional = true, default-features = false }
ssh-casign-ca-azure = { path = "../ssh-casign-ca-azure", optional = true, default-features = false }
ssh-casign-ca-file = { path = "../ssh-casign-ca-file", optional = true }
ssh-casign-ca-pkcs11 = { path = "../ssh-casign-ca-pkcs11", optional = true }
ssh-casign-ca-vault = { path = "../ssh-casign-ca-vault", optional = true, default-features = false }
