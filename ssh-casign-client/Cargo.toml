[package]
name = "ssh-casign-client"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version="4.5.21", features=["derive", "env"] }
color-eyre = "0.6.3"
dirs = "5.0.1"
rand = "0.8.5"
reqwest = { version = "0.11.13", features = ["native-tls", "json"] }
serde = { version = "1.0.214", features = ["derive", "rc"] }
serde_json = "1.0.132"
ssh-key = { version = "0.6.7", features = ["dsa", "p256", "ed25519", "rsa"] }
tokio = { version = "1.41.1", features = ["full"] }
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
