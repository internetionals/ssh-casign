[package]
name = "ssh-casign-proto"
version = "0.1.0"
edition = "2021"
description = "Wire types shared by ssh-casign-service and ssh-casign-client"

[dependencies]
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
ssh-key = { version = "0.6.7", features = ["p256", "p384", "p521", "ed25519", "rsa"] }
toml = "0.8.19"
