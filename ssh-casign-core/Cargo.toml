[package]
name = "ssh-casign-core"
version = "0.1.0"
edition = "2021"
description = "ssh-casign service logic: OIDC, certificate policy, key IDs, audit, HTTP API"

[dependencies]
axum = { version = "0.7.7", features = ["macros"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
axum-extra = { version = "0.9.4", features = ["typed-header"] }
libc = "0.2.191"
oidc-jwt-validator = "0.2.3"
rand = "0.8.5"
regex = "1.10.2"
reqwest = { version = "0.11.13", default-features = false, features = ["json"] }
serde = { version = "1.0.214", features = ["derive", "rc"] }
serde_json = "1.0.132"
sha2 = "0.10.9"
ssh-casign-ca = { path = "../ssh-casign-ca" }
ssh-casign-proto = { path = "../ssh-casign-proto" }
ssh-key = { version = "0.6.7", features = ["p256", "p384", "p521", "ed25519", "rsa"] }
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["full"] }
toml = "0.8.19"
tracing = "0.1.40"
