[package]
name = "ssh-casign-ca-aws"
version = "0.1.0"
edition = "2021"
description = "ssh-casign CA backend: AWS KMS, with AWS credentials (env, web identity, profile, ECS, IMDSv2)"

[features]
default = ["native-tls"]
# TLS for the connection to AWS (one is needed; the service binary chooses
# with its tls-native / tls-rustls features).
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls-native-roots", "reqwest/rustls-tls-webpki-roots"]

[dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["pkcs8"] }
p384 = { version = "0.13.1", features = ["pkcs8"] }
p521 = { version = "0.13.3", features = ["pkcs8"] }
reqwest = { version = "0.11.13", default-features = false, features = ["json"] }
rsa = "0.9.10"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
sha2 = "0.10.9"
ssh-casign-ca = { path = "../ssh-casign-ca" }
ssh-casign-store = { path = "../ssh-casign-store" }
ssh-key = { version = "0.6.7", features = ["p256", "p384", "p521", "ed25519", "rsa"] }
toml = "0.8.19"
tracing = "0.1.40"

[dev-dependencies]
tokio = { version = "1.41.1", features = ["macros", "rt"] }
